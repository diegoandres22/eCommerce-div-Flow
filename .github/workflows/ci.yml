# .github/workflows/ci.yml
#
# Pipeline real para este MVP (WhatsApp checkout, sin Stripe/pasarela de
# pago, sin Cypress). Antes este archivo traía jobs heredados de la
# plantilla base (Stripe, Resend, Cypress, Lighthouse) que probaban cosas
# que no existen en el código actual -- ver CLAUDE.md.

name: CI

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Lint, tests y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_ci
      NEXTAUTH_SECRET: ci-secret-${{ github.run_id }}
      NEXTAUTH_URL: http://localhost:3000
      ALLOWED_ADMIN_EMAIL: admin@ci.local
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SMTP_HOST: localhost
      SMTP_PORT: '587'
      SMTP_USER: ci@ci.local
      SMTP_PASS: ci-placeholder
      CONTACT_EMAIL_TO: ci@ci.local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Sin TEST_ADMIN_USER/TEST_ADMIN_PASS ni ALLOW_TEST_ADMIN: la cuenta de
      # prueba se queda deshabilitada también en CI, igual que en producción.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma y migrar
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests unitarios
        run: npm run test:unit

      - name: Build de producción
        run: npm run build

  security:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: npm audit (dependencias de producción)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Build de imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (sin push, solo valida que el Dockerfile compile)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: ecommerce:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
