# .github/workflows/ci.yml
#
# Pipeline real para este MVP (WhatsApp checkout, sin Stripe/pasarela de
# pago, sin Cypress). Antes este archivo traía jobs heredados de la
# plantilla base (Stripe, Resend, Cypress, Lighthouse) que probaban cosas
# que no existen en el código actual -- ver CLAUDE.md.

name: CI

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  build:
    name: Lint, tests y build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_ci
      # prisma/schema.prisma exige DIRECT_URL además de DATABASE_URL (Prisma
      # la usa para correr migraciones sin pasar por un connection pooler).
      # El Postgres de este job es un contenedor efímero sin pooler, así que
      # acá las dos apuntan a la misma conexión -- en Supabase de verdad son
      # distintas (ver .env.example).
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_ci
      NEXTAUTH_SECRET: ci-secret-${{ github.run_id }}
      NEXTAUTH_URL: http://localhost:3000
      ALLOWED_ADMIN_EMAILS: admin@ci.local
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SMTP_HOST: localhost
      SMTP_PORT: '587'
      SMTP_USER: ci@ci.local
      SMTP_PASS: ci-placeholder
      CONTACT_EMAIL_TO: ci@ci.local
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Sin ADMIN_CREDENTIALS: el login con correo y contraseña se queda
      # deshabilitado también en CI, igual que en un cliente que no lo pidió
      # (STORE_CONFIG.permitirLoginConCredenciales).

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma y migrar
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests unitarios
        run: npm run test:unit

      - name: Build de producción
        run: npm run build

  security:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # better-npm-audit (en vez de `npm audit` directo) lee .nsprc en la raíz
      # del repo -- ahí están documentadas, una por una, las vulnerabilidades
      # ya evaluadas y aceptadas (bundled dentro de next/node_modules, no
      # dependencias directas nuestras, bloqueadas hasta que Vercel publique
      # un next que las actualice). Cualquier vulnerabilidad alta NUEVA que
      # no esté en .nsprc sigue rompiendo este job igual que antes.
      - name: npm audit (dependencias de producción, con excepciones documentadas en .nsprc)
        run: npx better-npm-audit audit --production --level high

  docker:
    name: Build de imagen Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build (sin push, solo valida que el Dockerfile compile)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: ecommerce:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
