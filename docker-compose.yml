# Location: docker-compose.yml
#
# Alternativa a Vercel para auto-hospedar la app (ver docker/README.md).
# Solo dos servicios: Postgres (base de datos) y la app Next.js -- el
# proyecto no usa Redis, ni sube archivos a un volumen local (las imágenes
# van a Supabase Storage), así que ambos se sacaron de aquí. Las variables
# de entorno reales de la app se cargan desde .env.production
# (ver ese archivo).

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - ecommerce_network
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ecommerce_user -d ecommerce_db']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '3000:3000'
    environment:
      # Sobrescribe DATABASE_URL de .env.production para apuntar al servicio
      # "postgres" de esta misma red, no a localhost.
      - DATABASE_URL=postgresql://ecommerce_user:ecommerce_password@postgres:5432/ecommerce_db
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ecommerce_network:
    driver: bridge
